<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="topbar">
        <div>
          <p class="eyebrow">PostgreSQL</p>
          <h1>{{.Title}}</h1>
        </div>
        <form method="post" action="/logout">
          <button class="button secondary" type="submit">退出</button>
        </form>
      </div>
      {{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}
      {{if .Draft}}
      <div class="summary">
        <span>草稿对象</span>
        <strong>{{.Draft.Request.RoleName}} / {{.Draft.Request.DatabaseName}}</strong>
      </div>
      {{end}}
      <div class="actions">
        <a class="button secondary" href="/">返回首页</a>
      </div>
    </section>
  </main>
</body>
</html>
