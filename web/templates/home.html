<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="topbar">
        <div>
          <p class="eyebrow">PostgreSQL</p>
          <h1>{{.Title}}</h1>
        </div>
        <form method="post" action="/logout">
          <button class="button secondary" type="submit">退出</button>
        </form>
      </div>
      <p class="muted">当前目标：{{.TargetSummary}}</p>
      <p class="muted">登录认证已经启用，后续会在这里完成业务用户表单、SQL 预览和确认执行。</p>
      <a class="button" href="/healthz">检查服务状态</a>
    </section>
  </main>
</body>
</html>
